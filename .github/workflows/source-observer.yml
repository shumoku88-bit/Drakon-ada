name: Source Observer Qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-source-observer:
    name: Libadalang CFG on Intel macOS
    runs-on: macos-15-intel
    timeout-minutes: 50

    env:
      OBSERVER_RUNTIME: ${{ runner.temp }}/source-observer-runtime
      OBSERVER_CACHE_KEY: source-observer-lal-26.0.0-macos-x64-py3147-v1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.14.7
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'

      - name: Restore Libadalang observer runtime
        id: observer-runtime-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/source-observer-runtime
          key: ${{ env.OBSERVER_CACHE_KEY }}

      - name: Set up Alire
        if: steps.observer-runtime-cache.outputs.cache-hit != 'true'
        uses: alire-project/setup-alire@v6

      - name: Fetch and build Libadalang 26.0.0
        if: steps.observer-runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          alr -n settings --global --set solver.timeout 120
          mkdir -p "$RUNNER_TEMP/libadalang-source"
          cd "$RUNNER_TEMP/libadalang-source"

          fetched=false
          for attempt in 1 2 3; do
            if alr -n get libadalang=26.0.0; then
              fetched=true
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Libadalang acquisition attempt $attempt failed; retrying" >&2
              sleep $((attempt * 5))
            fi
          done
          if [[ "$fetched" != true ]]; then
            echo "Libadalang acquisition failed after 3 attempts" >&2
            exit 1
          fi

          LAL_DIR="$(find "$RUNNER_TEMP/libadalang-source" -maxdepth 1 -type d -name 'libadalang_*' -print -quit)"
          if [[ -z "$LAL_DIR" ]]; then
            echo "Libadalang crate directory was not created" >&2
            exit 1
          fi

          cd "$LAL_DIR"
          alr build --release -- -j0 -XLIBRARY_TYPE=relocatable

          LANGKIT_SOURCE="$(find "$HOME/.local/share/alire/releases" -maxdepth 1 -type d -name 'langkit_support_26.0.0_*' -print -quit)"
          if [[ -z "$LANGKIT_SOURCE" || ! -f "$LANGKIT_SOURCE/pyproject.toml" ]]; then
            echo "Langkit 26.0.0 source release was not found" >&2
            exit 1
          fi

          echo "LAL_DIR=$LAL_DIR" >> "$GITHUB_ENV"
          echo "LANGKIT_SOURCE=$LANGKIT_SOURCE" >> "$GITHUB_ENV"

      - name: Assemble Libadalang observer runtime
        if: steps.observer-runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VENV="$OBSERVER_RUNTIME/venv"
          LIBDIR="$OBSERVER_RUNTIME/lib"
          rm -rf "$OBSERVER_RUNTIME"
          mkdir -p "$LIBDIR"

          python -m venv "$VENV"
          source "$VENV/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install "$LANGKIT_SOURCE"

          cd "$LAL_DIR"
          python -m pip install ./python

          # Collect Libadalang and its Alire-built relocatable dependencies, but
          # prune dSYM bundles. Their DWARF payloads can have the same basename
          # as a dylib and are not loadable runtime libraries.
          find "$HOME/.local/share/alire/builds" \
            -path '*.dSYM' -prune -o \
            -name '*.dylib' \( -type f -o -type l \) \
            -exec cp -Lf {} "$LIBDIR/" \;
          find "$LAL_DIR" \
            -path '*.dSYM' -prune -o \
            -name '*.dylib' \( -type f -o -type l \) \
            -exec cp -Lf {} "$LIBDIR/" \;

          # Resolve the Ada runtime from the exact compiler selected by this
          # Libadalang workspace. Never flatten the whole GNAT toolchain: dSYM
          # bundles contain same-named Mach-O debug companions that can overwrite
          # the real runtime dylibs.
          WORKSPACE_GCC="$(alr exec -- which gcc)"
          if [[ -z "$WORKSPACE_GCC" || ! -x "$WORKSPACE_GCC" ]]; then
            echo "could not resolve the Libadalang workspace compiler" >&2
            exit 1
          fi
          GNAT_MAJOR="$(alr exec -- gcc -dumpversion | cut -d. -f1)"
          GNAT_RUNTIME_NAME="libgnat-${GNAT_MAJOR}.dylib"
          GNARL_RUNTIME_NAME="libgnarl-${GNAT_MAJOR}.dylib"
          GNAT_RUNTIME="$(alr exec -- gcc -print-file-name="$GNAT_RUNTIME_NAME")"
          GNARL_RUNTIME="$(alr exec -- gcc -print-file-name="$GNARL_RUNTIME_NAME")"

          echo "Libadalang workspace compiler: $WORKSPACE_GCC"
          alr exec -- gnat --version | head -1
          echo "Ada runtime: $GNAT_RUNTIME"
          echo "Tasking runtime: $GNARL_RUNTIME"

          for runtime in "$GNAT_RUNTIME" "$GNARL_RUNTIME"; do
            if [[ ! -f "$runtime" || "$runtime" == "$(basename "$runtime")" ]]; then
              echo "GNAT runtime could not be resolved: $runtime" >&2
              exit 1
            fi
            if ! file "$runtime" | grep -q 'dynamically linked shared library'; then
              echo "resolved GNAT runtime is not a loadable dylib: $runtime" >&2
              file "$runtime" >&2 || true
              exit 1
            fi
            cp -Lf "$runtime" "$LIBDIR/"
          done

          for required in \
            libadalang.dylib \
            libgnatcoll_projects.dylib \
            liblangkit_support.dylib \
            "$GNAT_RUNTIME_NAME" \
            "$GNARL_RUNTIME_NAME"
          do
            if [[ ! -f "$LIBDIR/$required" ]]; then
              echo "required runtime library not found: $required" >&2
              ls -1 "$LIBDIR" >&2 || true
              exit 1
            fi
          done

          printf '%s\n' \
            'libadalang=26.0.0' \
            "gnat-major=$GNAT_MAJOR" \
            'python=3.14.7' \
            > "$OBSERVER_RUNTIME/manifest.txt"
          echo "Prepared $(find "$LIBDIR" -maxdepth 1 -type f -name '*.dylib' | wc -l | tr -d ' ') dylibs"
          cat "$OBSERVER_RUNTIME/manifest.txt"

      - name: Save Libadalang observer runtime
        if: steps.observer-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/source-observer-runtime
          key: ${{ env.OBSERVER_CACHE_KEY }}

      - name: Activate observer runtime
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OBSERVER_RUNTIME/manifest.txt"
          test -x "$OBSERVER_RUNTIME/venv/bin/python"
          test -f "$OBSERVER_RUNTIME/lib/libadalang.dylib"
          cat "$OBSERVER_RUNTIME/manifest.txt"
          echo "$OBSERVER_RUNTIME/venv/bin" >> "$GITHUB_PATH"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$OBSERVER_RUNTIME/lib:/usr/local/lib:/usr/lib" >> "$GITHUB_ENV"

      - name: Qualify normalized control-flow observation
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import libadalang as lal; print("Libadalang:", getattr(lal, "__version__", "unknown"), lal.__file__)'
          python tools/qualify_source_observer.py --evidence build/evidence/source-observer.json
          cat build/evidence/source-observer.json
