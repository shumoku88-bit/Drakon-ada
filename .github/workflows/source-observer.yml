name: Source Observer Qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-source-observer:
    name: Libadalang CFG on Intel macOS
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Alire
        uses: alire-project/setup-alire@v6

      - name: Fetch and build Libadalang 26.0.0
        shell: bash
        run: |
          set -euo pipefail
          # Libadalang's dependency closure is large enough to exceed Alire's
          # normal first timeout on a fresh hosted runner. Give the solver time
          # to select the compiler required by the Libadalang workspace rather
          # than forcing the outer setup-alire default into that solution.
          alr -n settings --global --set solver.timeout 120
          mkdir -p "$RUNNER_TEMP/libadalang-source"
          cd "$RUNNER_TEMP/libadalang-source"

          # Retry only the acquisition boundary. GitHub release/archive fetches
          # can fail transiently (for example HTTP 5xx); semantic qualification
          # below remains strictly fail-closed.
          fetched=false
          for attempt in 1 2 3; do
            if alr -n get libadalang=26.0.0; then
              fetched=true
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Libadalang acquisition attempt $attempt failed; retrying" >&2
              sleep $((attempt * 5))
            fi
          done
          if [[ "$fetched" != true ]]; then
            echo "Libadalang acquisition failed after 3 attempts" >&2
            exit 1
          fi

          LAL_DIR="$(find "$RUNNER_TEMP/libadalang-source" -maxdepth 1 -type d -name 'libadalang_*' -print -quit)"
          if [[ -z "$LAL_DIR" ]]; then
            echo "Libadalang crate directory was not created" >&2
            exit 1
          fi

          cd "$LAL_DIR"
          alr build --release -- -j0 -XLIBRARY_TYPE=relocatable

          # The Alire build directory contains compiled Langkit_Support artifacts,
          # not the Langkit Python source tree. The release directory is the
          # original Langkit source archive and contains pyproject.toml.
          LANGKIT_SOURCE="$(find "$HOME/.local/share/alire/releases" -maxdepth 1 -type d -name 'langkit_support_26.0.0_*' -print -quit)"
          if [[ -z "$LANGKIT_SOURCE" || ! -f "$LANGKIT_SOURCE/pyproject.toml" ]]; then
            echo "Langkit 26.0.0 source release was not found" >&2
            exit 1
          fi

          echo "LAL_DIR=$LAL_DIR" >> "$GITHUB_ENV"
          echo "LANGKIT_SOURCE=$LANGKIT_SOURCE" >> "$GITHUB_ENV"

      - name: Install Python bindings and expose shared libraries
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/libadalang-venv"
          LIBDIR="$RUNNER_TEMP/libadalang-libs"
          python3 -m venv "$VENV"
          source "$VENV/bin/activate"
          python -m pip install --upgrade pip

          # Install the Langkit Python package from the source release. Its
          # pyproject declares the runtime Python dependencies needed by the
          # generated Libadalang bindings; the separate requirements files are
          # developer/test inputs and are not present in Alire's build tree.
          python -m pip install "$LANGKIT_SOURCE"

          cd "$LAL_DIR"
          python -m pip install ./python

          mkdir -p "$LIBDIR"

          # Alire places many relocatable library names behind symlinks. Copy
          # regular files and symlinks from this dependency solution into one
          # disposable runtime directory for qualification.
          find "$HOME/.local/share/alire/builds" \
            -name '*.dylib' \( -type f -o -type l \) \
            -exec cp -Lf {} "$LIBDIR/" \;
          find "$LAL_DIR" \
            -name '*.dylib' \( -type f -o -type l \) \
            -exec cp -Lf {} "$LIBDIR/" \;

          # The outer setup-alire toolchain and the compiler selected inside
          # the Libadalang workspace need not be the same version. Ask Alire
          # which compiler this workspace actually uses, then copy runtime
          # dylibs only from that exact toolchain. This avoids mixing GNAT
          # runtimes from multiple installed toolchains.
          WORKSPACE_GCC="$(alr exec -- which gcc)"
          if [[ -z "$WORKSPACE_GCC" || ! -x "$WORKSPACE_GCC" ]]; then
            echo "could not resolve the Libadalang workspace compiler" >&2
            exit 1
          fi
          WORKSPACE_GNAT_ROOT="$(dirname "$(dirname "$WORKSPACE_GCC")")"
          echo "Libadalang workspace compiler: $WORKSPACE_GCC"
          alr exec -- gnat --version | head -1
          echo "Libadalang workspace GNAT root: $WORKSPACE_GNAT_ROOT"

          find "$WORKSPACE_GNAT_ROOT" \
            -name '*.dylib' \( -type f -o -type l \) \
            -exec cp -Lf {} "$LIBDIR/" \;

          for required in \
            libadalang.dylib \
            libgnatcoll_projects.dylib \
            liblangkit_support.dylib \
            libgnat-15.dylib \
            libgnarl-15.dylib
          do
            if [[ ! -f "$LIBDIR/$required" ]]; then
              echo "required runtime library not found: $required" >&2
              echo "collected dylibs:" >&2
              ls -1 "$LIBDIR" >&2 || true
              exit 1
            fi
          done

          echo "Collected $(find "$LIBDIR" -maxdepth 1 -type f -name '*.dylib' | wc -l | tr -d ' ') dylibs for observer qualification"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$LIBDIR:/usr/local/lib:/usr/lib" >> "$GITHUB_ENV"

      - name: Qualify normalized control-flow observation
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import libadalang as lal; print("Libadalang:", getattr(lal, "__version__", "unknown"), lal.__file__)'
          python tools/qualify_source_observer.py --evidence build/evidence/source-observer.json
          cat build/evidence/source-observer.json
